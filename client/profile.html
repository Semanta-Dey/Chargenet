<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargeNet - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .profile-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--success));
        }
        .profile-card:hover {
            border-color: rgba(59, 130, 246, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.75rem;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 2px solid rgba(59, 130, 246, 0.4);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .profile-card:hover .profile-avatar {
            transform: scale(1.05) rotate(5deg);
            border-color: var(--primary-color);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
        }
        .profile-meta h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .profile-role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary-color);
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .profile-joined-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .profile-card {
                padding: 1.5rem;
            }
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.3s ease;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 16px;
            padding-left: 42px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #f8fafc;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.85);
        }
        .form-input:focus ~ .input-icon {
            color: var(--primary-color);
        }
        .form-input:disabled {
            background: rgba(15, 23, 42, 0.3) !important;
            border-color: rgba(255, 255, 255, 0.03) !important;
            color: var(--text-muted) !important;
            cursor: not-allowed;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt-lightning"></i>
            <span>ChargeNet</span>
        </div>
        <div class="nav-right">
            <span id="userNameDisplay" style="color:var(--text-muted);font-size:.9rem;"></span>
            <div class="user-badge">
                <i class="fa-solid fa-user"></i>
            </div>
            <a href="#" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Logout
            </a>
        </div>
    </header>

    <div class="app-container">
        <aside>
            <nav>
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-house-chimney-window"></i>
                    Dashboard
                </a>
                <a href="station.html" class="nav-link">
                    <i class="fa-solid fa-charging-station"></i>
                    Stations
                </a>
                <a href="bookings.html" class="nav-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    Bookings
                </a>
                <a href="session.html" class="nav-link">
                    <i class="fa-solid fa-bolt"></i>
                    My Sessions
                </a>
                <a href="history.html" class="nav-link">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    History
                </a>
            </nav>
        </aside>

        <main style="display: flex; align-items: center; justify-content: flex-start; flex-direction: column;">
            <!-- Toast Notification Container -->
            <div id="toastContainer" class="toast-container"></div>

            <div style="width:100%; max-width: 650px; padding: 2rem 0;">
                <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem;">My Account</h1>
                
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="profile-meta">
                            <h2 id="profileMetaName">Loading...</h2>
                            <div class="profile-role-badge">
                                <i class="fa-solid fa-shield-halved" style="font-size: 0.75rem;"></i>
                                <span id="profileMetaRole">USER</span>
                            </div>
                            <div class="profile-joined-text">
                                <i class="fa-solid fa-calendar-day"></i>
                                <span id="profileMetaJoined">Joined: N/A</span>
                            </div>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="profileName">Full Name *</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-user input-icon"></i>
                                    <input type="text" id="profileName" class="form-input" placeholder="e.g. John Doe" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="profileEmail">Email Address</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-envelope input-icon"></i>
                                    <input type="email" id="profileEmail" class="form-input" disabled>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="profilePhone">Phone Number</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-phone input-icon"></i>
                                    <input type="tel" id="profilePhone" class="form-input" placeholder="e.g. +1 555-0199">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="profileVehicle">EV Model</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-car-side input-icon"></i>
                                    <input type="text" id="profileVehicle" class="form-input" placeholder="e.g. Tesla Model Y">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-outline" id="resetProfileBtn" style="padding: 10px 20px;">Reset Form</button>
                            <button type="submit" class="btn btn-primary" id="saveProfileBtn" style="width: auto; padding: 10px 24px;">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script src="./js/auth.js"></script>
    <script src="./js/profile.js"></script>
</body>
</html>
