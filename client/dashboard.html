<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargeNet - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt-lightning"></i>
            <span>ChargeNet</span>
        </div>
        <div class="nav-right">
            <span id="userNameDisplay" style="color:var(--text-muted);font-size:.9rem;"></span>
            <div class="user-badge">
                <i class="fa-solid fa-user"></i>
            </div>
            <a href="#" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Logout
            </a>
        </div>
    </header>

    <div class="app-container">
        <aside>
            <nav>
                <a href="dashboard.html" class="nav-link active">
                    <i class="fa-solid fa-house-chimney-window"></i>
                    Dashboard
                </a>
                <a href="station.html" class="nav-link">
                    <i class="fa-solid fa-charging-station"></i>
                    Stations
                </a>
                <a href="bookings.html" class="nav-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    Bookings
                </a>
                <a href="session.html" class="nav-link">
                    <i class="fa-solid fa-bolt"></i>
                    My Sessions
                </a>
                <a href="history.html" class="nav-link">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    History
                </a>
            </nav>
        </aside>

        <main>
            <div class="map-view">
                <img src="./assets/images/dashboard_map_1776618849354.png" alt="Map View" class="map-placeholder">
                <div class="map-search">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                    <input type="text" placeholder="Search location...">
                </div>
                
                <!-- Mock Map Pins -->
                <div style="position: absolute; top: 40%; left: 35%; color: var(--success); font-size: 1.5rem;"><i class="fa-solid fa-location-dot"></i></div>
                <div style="position: absolute; top: 30%; left: 50%; color: var(--success); font-size: 1.5rem;"><i class="fa-solid fa-location-dot"></i></div>
                <div style="position: absolute; top: 60%; left: 55%; color: var(--success); font-size: 1.5rem;"><i class="fa-solid fa-location-dot"></i></div>
                <div style="position: absolute; top: 45%; left: 70%; color: var(--danger); font-size: 1.5rem;"><i class="fa-solid fa-location-dot"></i></div>
                <div style="position: absolute; top: 25%; left: 65%; color: var(--success); font-size: 1.2rem;"><i class="fa-solid fa-circle-dot"></i></div>
            </div>

            <section class="station-section">
                <div class="grid-header">
                    <h2>Nearby Stations</h2>
                </div>

                <div class="station-grid" id="stationGrid">
                    <!-- Stations will load dynamically -->
                </div>

                <div class="see-more-container">
                    <a href="station.html" class="btn-see-more">See more</a>
                </div>
            </section>

            <!-- ===== PRICE COMPARISON GRAPH ===== -->
            <section class="station-section" style="margin-top: 2rem; margin-bottom: 2rem; width: 100%; max-width: 900px;">
                <div class="grid-header">
                    <h2>Station Price Comparison</h2>
                </div>
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; margin-top: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.25);">
                    <div style="width: 100%; height: 300px; position: relative;">
                        <canvas id="chartPriceComparison"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script src="./js/auth.js"></script>
    <script src="./js/dashboard.js"></script>
</html>
